name: PC (Electron)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:desktop && npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Clandestin-Arcade-Manager-Windows-Setup
          path: installer-release/Clandestin-Arcade-Manager-Setup-*.exe
          retention-days: 1

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            name: Clandestin-Arcade-Manager-Linux-x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            name: Clandestin-Arcade-Manager-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle (static)
        run: npm run build:desktop

      - name: Package app
        run: >
          npx @electron/packager . "Clandestin Arcade Manager"
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }}
          --out=electron-release
          --overwrite
          --ignore="^/src"
          --ignore="^/android"
          --ignore="^/public/models/android-meshy"
          --ignore="^/electron-release"

      - name: Zip build
        run: |
          cd electron-release
          for d in */; do
            zip -r "../${{ matrix.name }}.zip" "$d" > /dev/null
          done

      - name: Upload portable build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          retention-days: 1

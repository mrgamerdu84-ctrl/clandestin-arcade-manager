name: PC (Electron)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:desktop && npx electron-builder --win nsis --x64 --publish never

      # Keep the Actions artifact as a short-lived fallback. A full artifact
      # quota must not fail the build.
      - name: Upload Windows installer artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Clandestin-Arcade-Manager-Windows-Setup
          path: installer-release/Clandestin-Arcade-Manager-Setup-*.exe
          retention-days: 1

      # Publish the installer on a stable GitHub Release so it can be
      # downloaded without extracting an Actions artifact ZIP.
      - name: Publish Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "windows-v$version"
          $installer = Get-ChildItem "installer-release/Clandestin-Arcade-Manager-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Clandestin Arcade Manager Windows v$version" --notes "Installateur Windows de Clandestin Arcade Manager. Téléchargez le fichier Setup.exe puis double-cliquez dessus pour installer le jeu."
          }

          gh release upload $tag $installer.FullName --clobber

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            name: Clandestin-Arcade-Manager-Linux-x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            name: Clandestin-Arcade-Manager-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle (static)
        run: npm run build:desktop

      - name: Package app
        run: >
          npx @electron/packager . "Clandestin Arcade Manager"
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }}
          --out=electron-release
          --overwrite
          --ignore="^/src"
          --ignore="^/android"
          --ignore="^/public/models/android-meshy"
          --ignore="^/electron-release"

      - name: Zip build
        run: |
          cd electron-release
          for d in */; do
            zip -r "../${{ matrix.name }}.zip" "$d" > /dev/null
          done

      - name: Upload portable build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          retention-days: 1

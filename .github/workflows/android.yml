name: Android (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Construire un APK/AAB signé (release)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/android && bun add -d @capacitor/cli

      - name: Build static web assets for Android
        run: bun run build:desktop

      - name: Add / sync Android platform
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            bunx cap add android
          fi
          bunx cap sync android

      - name: Decode keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        if: ${{ !inputs.release }}
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build release APK + AAB
        if: ${{ inputs.release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-coin-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

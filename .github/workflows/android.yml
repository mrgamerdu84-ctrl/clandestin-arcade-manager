name: Android (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install --no-save --legacy-peer-deps @capacitor/cli @capacitor/core @capacitor/android

      - name: Build static web assets for Android
        run: npm run build:desktop

      - name: Sync Android platform
        run: ./node_modules/.bin/cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release-android
          APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" release-android/Clandestin-Arcade-Manager-Android.apk

      - name: Publish Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Clandestin Arcade Manager Android v${VERSION}" --notes "APK Android de Clandestin Arcade Manager."
          gh release upload "$TAG" release-android/Clandestin-Arcade-Manager-Android.apk --clobber

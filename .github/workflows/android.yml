name: Android (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Construire un APK/AAB signé (release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/android && bun add -d @capacitor/cli

      - name: Build static web assets for Android
        run: bun run build:desktop

      - name: Add / sync Android platform
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            bunx cap add android
          fi
          bunx cap sync android

      - name: Decode keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        if: ${{ !inputs.release }}
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build release APK + AAB
        if: ${{ inputs.release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare stable Android download names
        shell: bash
        run: |
          mkdir -p release-android
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK introuvable"
            exit 1
          fi
          cp "$APK" release-android/Clandestin-Arcade-Manager-Android.apk

          AAB=$(find android/app/build/outputs/bundle -type f -name "*.aab" 2>/dev/null | head -n 1 || true)
          if [ -n "$AAB" ]; then
            cp "$AAB" release-android/Clandestin-Arcade-Manager-Android.aab
          fi

          sha256sum release-android/Clandestin-Arcade-Manager-Android.apk > release-android/SHA256SUMS.txt
          if [ -f release-android/Clandestin-Arcade-Manager-Android.aab ]; then
            sha256sum release-android/Clandestin-Arcade-Manager-Android.aab >> release-android/SHA256SUMS.txt
          fi

      - name: Upload Actions artifact fallback
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Clandestin-Arcade-Manager-Android
          path: release-android/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish Android build to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Clandestin Arcade Manager Android v${VERSION}" \
              --notes "Version Android installable de Clandestin Arcade Manager. Téléchargez Clandestin-Arcade-Manager-Android.apk puis ouvrez-le sur votre téléphone."

          gh release upload "$TAG" release-android/* --clobber

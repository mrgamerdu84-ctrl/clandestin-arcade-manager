name: Android (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install --no-save --legacy-peer-deps @capacitor/cli @capacitor/core @capacitor/android

      - name: Apply lightweight Android club upgrade
        run: node scripts/apply-android-club-lite.mjs

      - name: Build stable Android web assets
        run: npx vite build --config vite.desktop.config.ts

      - name: Ensure Android platform is complete
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Android platform incomplete: recreating it"
            rm -rf android
            ./node_modules/.bin/cap add android
          fi

      - name: Sync Android platform
        run: ./node_modules/.bin/cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release-android
          APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" release-android/Clandestin-Arcade-Manager-Android.apk

      - name: Publish Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-stable-v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Clandestin Arcade Manager Android stable v${VERSION}" --notes "Build Android stable avec première nouveauté club légère, sans modifier la transition extérieur/intérieur."
          gh release upload "$TAG" release-android/Clandestin-Arcade-Manager-Android.apk --clobber

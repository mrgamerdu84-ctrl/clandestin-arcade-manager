name: TikoWiko Security Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prevent-secrets:
    name: Prevent committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Block sensitive files and obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            case "$file" in
              .env|*/.env|.env.local|*/.env.local|.env.production|*/.env.production|*.jks|*.keystore|*.p12|*.pfx)
                echo "::error file=$file::Sensitive file must not be committed. Use GitHub Secrets or secure local storage."
                failed=1;;
            esac
          done < <(git ls-files)
          if git grep -n -I -E -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}|sk-proj-[A-Za-z0-9_-]{20,}' -- .; then
            echo "::error::A value resembling a private key or access token was found. Move it to GitHub Secrets and rotate it if it is real."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "Security check passed: no obvious committed secrets found."

# TikoWiko rule: never store a user password/PIN in source code.
# App lock credentials must be hashed/derived or validated by a secure auth service.
